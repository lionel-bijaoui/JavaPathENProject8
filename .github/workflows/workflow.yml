name: CI
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: fast
            groups: "!slow-a & !slow-b"
          - suite: slow-a
            groups: "slow-a"
          - suite: slow-b
            groups: "slow-b"
    name: Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Installer les librairies locales
        run: |
          mvn -B -ntp install:install-file -Dfile=./TourGuide/libs/gpsUtil.jar -DgroupId=gpsUtil -DartifactId=gpsUtil -Dversion=1.0.0 -Dpackaging=jar
          mvn -B -ntp install:install-file -Dfile=./TourGuide/libs/RewardCentral.jar -DgroupId=rewardCentral -DartifactId=rewardCentral -Dversion=1.0.0 -Dpackaging=jar
          mvn -B -ntp install:install-file -Dfile=./TourGuide/libs/TripPricer.jar -DgroupId=tripPricer -DartifactId=tripPricer -Dversion=1.0.0 -Dpackaging=jar
      - run: mvn -B -ntp -f TourGuide/pom.xml verify -Dgroups='${{ matrix.groups }}'
      - name: Publier le rapport de tests
        if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v6
        with:
          check_name: 'Tests ${{ matrix.suite }}'
          report_paths: '**/target/surefire-reports/TEST-*.xml'

  package:
    name: Package du jar
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Installer les librairies locales
        run: |
          mvn -B -ntp install:install-file -Dfile=./TourGuide/libs/gpsUtil.jar -DgroupId=gpsUtil -DartifactId=gpsUtil -Dversion=1.0.0 -Dpackaging=jar
          mvn -B -ntp install:install-file -Dfile=./TourGuide/libs/RewardCentral.jar -DgroupId=rewardCentral -DartifactId=rewardCentral -Dversion=1.0.0 -Dpackaging=jar
          mvn -B -ntp install:install-file -Dfile=./TourGuide/libs/TripPricer.jar -DgroupId=tripPricer -DartifactId=tripPricer -Dversion=1.0.0 -Dpackaging=jar
      - run: mvn -B -ntp -f TourGuide/pom.xml package -DskipTests
      - name: Upload du jar
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: TourGuide/target/*.jar
          retention-days: 30
          if-no-files-found: error